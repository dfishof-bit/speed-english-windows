name: Build Windows Offline EXE

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single-File EXE
        run: dotnet publish SpeedEnglish.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SpeedEnglish-Hebrew-Windows-EXE
          path: publish/SpeedEnglish.exe
          if-no-files-found: error
